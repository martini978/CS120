<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> JavaScript Practice </title>
    </head>
    <script>
        window.onload = function(){
            result = document.getElementById("answer");
            // Using for loop
            function countA(numArr, a){
                count = 0;
                // Loop through the whole array
                for (i = 0; i < numArr.length; i++){
                    // Checks if the number at the specified index is less than
                    // the provided value
                    if(numArr[i] < a){
                        count += 1;
                    }
                }
                return count;
            }

            // Using array method (filter or reduce)
            function countB(numArr, a){
                return numArr.filter(val => val < a).length;
            }

            function testCount(){
                numArr = [3, 7, 12, 4, 9, 22, 34];
                a = 27
                resultA = countA(numArr, a);
                resultB = countB(numArr, a);
            }

            testCount();
            // Display results of countA and countB in the div. 
            result.innerHTML = "The results: " + resultA + "<br>" + resultB;
        }
    </script>
    <body>
        <div id="answer"></div>
    </body>
</html>
