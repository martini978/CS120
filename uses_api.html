<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> API Usage Practice </title>
        <style type="text/css">
            #results{width: 500px; height: 100%; border: 1px solid #000; 
                padding: 20px;}
        </style>
    </head>
    <script>
        url = `https://api.fbi.gov/wanted/v1/list?sex=male&hair=blond`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                data.items.forEach(persons => {
                    name = persons.title;
                    nationality = persons.nationality;
                    eye_color = persons.eyes;
                    dob = persons.dates_of_birth_used;
                    weight = persons.weight_max;
                    document.getElementById("results").innerHTML += "Name: " 
                    + name + "<br>" + "Date of Birth: " + dob + "<br>" 
                    + "Weight: " + weight + "<br>" + "Nationality: " 
                    + nationality + "<br>" + "Eye Color: " + eye_color 
                    + "<br>" + "<br>";
                })
            })
            .catch(error => {
                console.log("Could not find data")
            })
    </script>
    <body>
        <h1> FBI Most Wanted </h1>
        <div id="results"></div>
    </body>
</html>
