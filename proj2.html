<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> Wordle Game </title>
        <style type="text/css">
            body,html{text-align: center; background-color: #bce4ff;}
            #title{font-size: 60px; align-items: center;}
            .word{width: 70px; height: 70px; box-sizing: border-box; 
                border: 2px solid #000; margin: 13px; display: inline-block;
                border-radius: 5px; text-align: center; padding: 15px; 
                font-size: 25px; font-weight: 600; margin-top: 3px;}
            #user_input{border: 1px solid #000; border-radius: 3px; 
                height: 15px;}
            #check_word, #reset, #hint{height: 21px;}
            .green{background-color: #0bb402;}
            .yellow{background-color: #edf904;}
            .grey{background-color: #777777;}
            #keyboard{width: 100%; height: 100px; 
                box-sizing: border-box; text-align: center;}
            .key{width: 50px; height: 50px; border: 1px solid #000; 
                margin: 8px; text-align: center; border-radius: 5px;
                box-sizing: border-box; padding: 13px; margin-top: 12px;}
            #keyboard div[class*="letter"]{font-weight: 600}
            .keyboard_row{display: flex; justify-content: center;}
            @media(max-width: 700px){
                #title{font-size: 45px;}
            }
            @media(max-width: 530px){
                #title{font-size: 35px;}
                .word{width: 50px; height: 50px}
                .key{width: 40px; height: 40px; padding: 10px}
            }
        </style>
    </head>
    <script src="proj2.js"></script>
    <body>
        <h1 id="title"> Can You Guess the Word? </h1>
        <div id="game_board"></div>
        <input type="button" id="hint" value="Hint?">
        <input type="text" id="user_input">
        <input type="button" id="check_word" value="Submit Guess">
        <input type="button" id="reset" value="Restart">
        <div id="keyboard"></div>
    </body>
</html>
